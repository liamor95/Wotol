[/Script/UnrealEd.ProjectPackagingSettings]
; Config de build : Development pour la 1re validation (diagnostic facile),
; puis passer a Shipping dans l'UI pour la version publique.
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
bCompressed=True
bSkipEditorContent=True
bShareMaterialShaderCode=True
; PREREQUIS Windows (VC++ redist) inclus dans le build -> lancable sur un PC sans UE.
IncludePrerequisites=True
IncludeAppLocalPrerequisites=False
; ── CARTES A CUIRE : la demo n'utilise QU'UNE map (procedurale). On la liste
; explicitement pour garantir qu'elle est incluse dans le build. ──
+MapsToCook=(FilePath="/Game/Maps/L_Demo")
; Si tu ajoutes d'autres maps a la boucle, ajoute-les ici de la meme facon.

; ── DOSSIERS TOUJOURS CUITS ──
; Le code charge des assets PAR CHEMIN au runtime (musiques /Game/Audio/Music, image de
; menu /Game/UI, VFX/meshes assignes par soft-ref). Ces assets ne sont PAS forcement
; references par la map -> on FORCE leur cuisson pour qu'ils soient dans le build.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Factions")
+DirectoriesToAlwaysCook=(Path="/Game/Data")
