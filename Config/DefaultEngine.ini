[/Script/EngineSettings.GameMapsSettings]
; GameMode démo par défaut : tout niveau lancé en Play utilise automatiquement
; WOTOLGameMode_Demo (plus besoin de le régler dans World Settings).
GlobalDefaultGameMode=/Script/WOTOL.WOTOLGameMode_Demo
; ── CARTE DE DÉMARRAGE (build autonome) ──
; La démo est 100 % procédurale (WOTOLGameMode_Demo spawn tout) -> une map VIDE suffit.
; À CRÉER dans l'éditeur : Content/Maps/L_Demo  (File > New Level > Empty Level, puis Save).
; Une fois créée, ces lignes la designent comme carte de lancement du jeu packagé.
GameDefaultMap=/Game/Maps/L_Demo.L_Demo
EditorStartupMap=/Game/Maps/L_Demo.L_Demo
ServerDefaultMap=/Game/Maps/L_Demo.L_Demo
GlobalDefaultServerGameMode=/Script/WOTOL.WOTOLGameMode_Demo

; ── AFFICHAGE (robuste pour une démo sur n'importe quel écran) ──
[/Script/Engine.GameUserSettings]
bUseVSync=True
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
; 1 = Windowed Fullscreen (borderless) : s'adapte a l'ecran, pas de fenetre minuscule/hors-ecran.
FullscreenMode=1
LastConfirmedFullscreenMode=1
PreferredFullscreenMode=1

; ── POST-PROCESS ──
; Flou cinétique désactivé globalement : inadapté à une caméra RTS/isométrique (mouvements de
; caméra nets attendus, pas de "cinéma"), et cause un écran figé flou en pause (remonté par
; Liamor le 31/07/2026 : SetGamePaused() fige la simulation mais le rendu continue d'appliquer
; le flou calculé sur le dernier mouvement de caméra avant la pause, qui ne se "efface" jamais
; puisqu'aucune nouvelle image nette n'est recalculée pendant la pause).
[/Script/Engine.RendererSettings]
r.DefaultFeature.MotionBlur=False

[/Script/NavigationSystem.RecastNavMesh]
; Génération de navigation DYNAMIQUE : le décor spawné en code est pris en compte
; -> les unités contournent mieux les obstacles (moins de blocages).
RuntimeGeneration=Dynamic

[/Script/Engine.NavigationSystemV1]
bAutoCreateNavigationData=True
