[/Script/EngineSettings.GameMapsSettings]
; GameMode démo par défaut : tout niveau lancé en Play utilise automatiquement
; WOTOLGameMode_Demo (plus besoin de le régler dans World Settings).
GlobalDefaultGameMode=/Script/WOTOL.WOTOLGameMode_Demo

[/Script/NavigationSystem.RecastNavMesh]
