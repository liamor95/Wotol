[/Script/Engine.InputSettings]
; ─────────────────────────────────────────────────────────────────────────────
; Entrées WOTOL — système d'entrées CLASSIQUE (BindAxis/BindAction), cohérent avec
; le code C++ existant (WOTOLHeroCharacter, PlayerController_Exploration).
; Nage en VOLUME : ZQSD (AZERTY) + WASD (QWERTY) + flèches ; montée/descente au
; clavier ; visée à la souris. Pensé pour être clair et jouable par tout le monde.
; ─────────────────────────────────────────────────────────────────────────────
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown

; ─── Déplacement horizontal ──────────────────────────────────────────────────
; Avancer / reculer : Z ou W ou Haut / S ou Bas
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Z)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=Down)
; Gauche / droite : Q ou A ou Gauche / D ou Droite
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=Q)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=Left)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=Right)

; ─── Déplacement vertical (nage) ─────────────────────────────────────────────
; Descendre : Espace ; Monter : E, Ctrl gauche ou Maj gauche. Espace = descendre a ete mis en
; place le 31/07/2026 sur retour de Liamor, aligne avec la camera RTS de bataille
; (AWOTOLBattleCamera::InputVerticalDown, qui utilise deja Espace = descendre). BUG CORRIGE
; (01/08/2026, retour terrain : "c'est la touche E qui ne fonctionne pas bien, au lieu de faire
; monter le personnage elle le fait descendre") : E avait ete bascule vers "descendre" EN MEME
; TEMPS que Espace lors de ce changement, par erreur -- seul Espace devait changer de sens. E
; repasse a Scale=1.0 (monter), sa convention normale, INDEPENDAMMENT du sens de Espace.
+AxisMappings=(AxisName="MoveUp",Scale=-1.0,Key=SpaceBar)
+AxisMappings=(AxisName="MoveUp",Scale=1.0,Key=E)
+AxisMappings=(AxisName="MoveUp",Scale=1.0,Key=LeftControl)
+AxisMappings=(AxisName="MoveUp",Scale=1.0,Key=LeftShift)

; ─── Caméra (souris) ─────────────────────────────────────────────────────────
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)

; ─── Actions ─────────────────────────────────────────────────────────────────
+ActionMappings=(ActionName="Interact",Key=F)
+ActionMappings=(ActionName="Interact",Key=Enter)

; ─── Sensation ACTION en exploration (héros 3e personne) ──────────────────────
; Sprint maintenu : Alt gauche (Shift/Ctrl déjà pris par la descente).
+ActionMappings=(ActionName="Sprint",Key=LeftAlt)
; Ruée courte (impulsion + recharge) : C, libre et facile d'accès près de ZQSD/WASD.
; PAS de clic souris ici : le clic gauche sert déjà au placement (Cristalliseur, tourelles).
+ActionMappings=(ActionName="Dash",Key=C)
